<!DOCTYPE html>
<html>
    <head>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <title>
            Login - Academic Integrity Case Tracker
        </title>
        <link href="style.css" rel="stylesheet"/>
    </head>
    <body>
        <div class="login-page">
            <div class="login-box">
                <img alt="Lovely Professional University logo" class="login-logo" src="https://www.lpu.in/lpu-assets/images/media-kit/lpu-logo.jpg"/>
                <h1>
                    Academic Integrity
                </h1>
                <p>
                    Case Tracker Login
                </p>
                <div class="tagline login-tagline">
                    CSE 326 &middot; Academic project
                </div>
                <form action="dashboard.html">
                    <div class="form-group">
                        <label>
                            Username
                        </label>
                        <input id="username" placeholder="Enter username" required="" type="text"/>
                    </div>
                    <div class="form-group">
                        <label>
                            Password
                        </label>
                        <input id="password" placeholder="Enter password" required="" type="password"/>
                    </div>
                    <button class="btn" type="submit">
                        Login
                    </button>
                </form>
            </div>
        </div>
        <script src="app.js">
        </script>
    </body>
</html>
